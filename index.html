<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Какой скилл брать</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root {
  --ink: #1d2328;
  --muted: #5b6671;
  --line: #e2e6ea;
  --bg: #ffffff;
  --panel: #f6f8f9;
  --accent: #1f6feb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 16px/1.55 Arial, Helvetica, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 28px; line-height: 1.25; margin: 8px 0 4px; }
h2 { font-size: 22px; margin: 36px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
h3 { font-size: 17px; margin: 22px 0 8px; color: var(--muted); font-weight: normal; }
p { margin: 10px 0; }
p.lead { color: var(--muted); }
code { font-family: Consolas, "Courier New", monospace; font-size: 14px; background: var(--panel); padding: 1px 5px; border-radius: 3px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 18px 14px; margin: 20px 0; }
.card h2 { border-top: 0; padding-top: 12px; margin-top: 8px; font-size: 18px; }
.card ul { margin: 6px 0; padding-left: 20px; }
.card li { margin: 6px 0; }
.toc { margin: 18px 0; color: var(--muted); font-size: 15px; }
.toc span { margin-right: 4px; }
.toc a { display: inline-block; margin: 2px 10px 2px 0; color: var(--accent); text-decoration: none; }
.toc a:hover { text-decoration: underline; }
.filter { margin: 20px 0 8px; }
.filter label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.filter input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 6px; }
.filter input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
table.cases { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
table.cases th { text-align: left; font-size: 13px; color: var(--muted); font-weight: normal; border-bottom: 1px solid var(--line); padding: 6px 8px; }
table.cases td { border-bottom: 1px solid var(--line); padding: 9px 8px; vertical-align: top; }
table.cases td.skill { white-space: normal; }
dl.skills { margin: 8px 0 0; }
dl.skills dt { margin-top: 12px; }
dl.skills dd { margin: 2px 0 0; color: var(--muted); }
footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.gate { max-width: 420px; margin: 14vh auto; padding: 0 16px; }
.gate h1 { font-size: 22px; }
.gate p { color: var(--muted); font-size: 15px; }
.gate input { width: 100%; padding: 11px 12px; font: inherit; border: 1px solid var(--line); border-radius: 6px; }
.gate button { margin-top: 10px; width: 100%; padding: 11px 12px; font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
.gate button:disabled { opacity: .6; cursor: default; }
.gate .err { color: #b4232a; min-height: 22px; font-size: 14px; margin-top: 8px; }
.hidden { display: none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6e9ec; --muted: #9aa5b1; --line: #2c333a; --bg: #15191d; --panel: #1d2328; --accent: #64a0ff;
  }
}
@media (max-width: 560px) {
  table.cases, table.cases thead, table.cases tbody, table.cases tr, table.cases td, table.cases th { display: block; }
  table.cases thead { display: none; }
  table.cases tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
  table.cases td { border: 0; padding: 3px 0; }
}
</style>
</head>
<body>
<section class="gate" id="gate">
  <h1>Какой скилл брать</h1>
  <p>Страница закрыта паролем. Пароль спросите у Станислава.</p>
  <form id="form">
    <input id="pw" type="password" autocomplete="current-password" aria-label="Пароль" autofocus>
    <button type="submit" id="go">Открыть</button>
  </form>
  <div class="err" id="err"></div>
</section>
<main id="content" class="hidden"></main>

const ROUNDS = 310000;

function bytes(b64) {
  const raw = atob(b64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i += 1) out[i] = raw.charCodeAt(i);
  return out;
}

async function unlock(password) {
  const blob = bytes(PAYLOAD);
  const salt = blob.slice(0, 16);
  const iv = blob.slice(16, 28);
  const data = blob.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ROUNDS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
  return new TextDecoder().decode(plain);
}

const form = document.getElementById("form");
const err = document.getElementById("err");
const go = document.getElementById("go");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.getElementById("pw").value;
  if (!password) return;
  err.textContent = "";
  go.disabled = true;
  go.textContent = "Открываю…";
  try {
    const content = await unlock(password);
    document.getElementById("gate").classList.add("hidden");
    const main = document.getElementById("content");
    main.innerHTML = content;
    main.classList.remove("hidden");
    document.title = main.querySelector("h1") ? main.querySelector("h1").textContent : document.title;
    const q = document.getElementById("q");
    if (q) {
      q.addEventListener("input", () => {
        const needle = q.value.trim().toLowerCase();
        document.querySelectorAll("#content table.cases tbody tr").forEach((row) => {
          row.classList.toggle("hidden", needle.length > 1 && !row.textContent.toLowerCase().includes(needle));
        });
        document.querySelectorAll("#content dl.skills dt").forEach((term) => {
          const body = term.nextElementSibling;
          const text = (term.textContent + " " + (body ? body.textContent : "")).toLowerCase();
          const hide = needle.length > 1 && !text.includes(needle);
          term.classList.toggle("hidden", hide);
          if (body) body.classList.toggle("hidden", hide);
        });
        document.querySelectorAll("#content section.group").forEach((section) => {
          const visible = section.querySelectorAll("tbody tr:not(.hidden), dl.skills dt:not(.hidden)").length;
          section.classList.toggle("hidden", needle.length > 1 && visible === 0);
        });
      });
    }
  } catch (error) {
    err.textContent = "Пароль не подошёл.";
    go.disabled = false;
    go.textContent = "Открыть";
  }
});
</script>
